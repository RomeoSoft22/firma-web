<div class="marco">
  <aside class="lateral">
    <div class="marca">
      <span class="logo">FD</span>
      <div>
        <strong>Firma Digital</strong>
        <small>PAdES · Web local</small>
      </div>
    </div>
    <nav>
      @for (item of menu; track item.ruta) {
        <a [routerLink]="item.ruta" routerLinkActive="activo">
          <span class="icono">{{ item.icono }}</span>{{ item.texto }}
          @if (item.protegida && !acceso.autenticado()) {
            <span class="candado-menu" title="Requiere iniciar sesión con tu cuenta">🔒</span>
          }
        </a>
      }
    </nav>
    <div class="conexiones">
      @if (acceso.autenticado()) {
        @if (acceso.usuario(); as u) {
          <div class="usuario-sesion" [title]="u.correo ?? ''">{{ u.nombre || u.correo }}</div>
        }
        <button type="button" class="cerrar-sesion" (click)="cerrarSesion()">Cerrar sesión</button>
      }
      <div class="conexion" [class.ok]="estado.agenteOk()" [class.mal]="estado.agenteOk() === false">
        <span class="punto"></span> Agente local
      </div>
      <div class="conexion" [class.ok]="estado.apiOk()" [class.mal]="estado.apiOk() === false">
        <span class="punto"></span> Servicio de registro
      </div>
    </div>
  </aside>
  <main class="contenido">
    <router-outlet />
  </main>
</div>
